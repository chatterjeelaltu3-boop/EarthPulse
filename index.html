<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a1e2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>📍 Location Test - EarthPulse</title>
    <style>
        /* ============================================
           COMPLETE STYLES
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at top, #0c2740 0%, #061522 50%, #04101b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 60px;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .subtitle strong {
            color: #00d4ff;
            -webkit-text-fill-color: #00d4ff;
        }

        /* --- Button --- */
        .btn {
            width: 100%;
            padding: 18px 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.6;
            transform: scale(1);
        }

        .btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn.loading .spinner {
            display: block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Status --- */
        .status {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            transition: all 0.3s;
        }

        .status.success {
            border-color: rgba(76, 223, 139, 0.25);
            background: rgba(76, 223, 139, 0.06);
            color: #4cdf8b;
        }

        .status.error {
            border-color: rgba(255, 107, 107, 0.25);
            background: rgba(255, 107, 107, 0.06);
            color: #ff6b6b;
        }

        .status.info {
            border-color: rgba(0, 212, 255, 0.25);
            background: rgba(0, 212, 255, 0.06);
            color: #72dfff;
        }

        .status .small {
            font-size: 12px;
            opacity: 0.7;
        }

        /* --- Result --- */
        .result-box {
            margin-top: 16px;
            padding: 18px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
            animation: fadeIn 0.4s ease;
        }

        .result-box.show {
            display: block;
        }

        .result-box .big-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .result-box .coords {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin: 6px 0 10px;
            color: #72dfff;
            word-break: break-all;
        }

        .result-box .coords strong {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .details-grid .item {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .details-grid .item .label {
            display: block;
            color: rgba(255, 255, 255, 0.3);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .details-grid .item .value {
            font-weight: 600;
            font-size: 14px;
            margin-top: 2px;
        }

        .success-msg {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(76, 223, 139, 0.06);
            border: 1px solid rgba(76, 223, 139, 0.1);
            font-size: 13px;
            color: #4cdf8b;
        }

        /* --- Badge --- */
        .badge-container {
            margin-top: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge.https {
            background: rgba(76, 223, 139, 0.12);
            color: #4cdf8b;
            border: 1px solid rgba(76, 223, 139, 0.15);
        }

        .badge.http {
            background: rgba(255, 107, 107, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.15);
        }

        .badge.local {
            background: rgba(0, 212, 255, 0.12);
            color: #72dfff;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        /* --- Footer --- */
        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
        }

        /* --- Responsive --- */
        @media (max-width: 420px) {
            .container {
                padding: 25px 18px;
            }
            h1 {
                font-size: 26px;
            }
            .logo {
                font-size: 48px;
            }
            .btn {
                font-size: 16px;
                padding: 16px;
            }
            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 350px) {
            .container {
                padding: 20px 14px;
            }
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <span class="logo">📍</span>
        <h1>Location Test</h1>
        <p class="subtitle">
            Check if your phone can detect location<br>
            <strong>📱 Works on HTTPS only</strong>
        </p>

        <!-- Button -->
        <button id="getLocationBtn" class="btn">
            <span class="btn-text">📍 Get My Location</span>
            <span class="spinner"></span>
        </button>

        <!-- Status -->
        <div id="status" class="status">🔍 Ready to detect location</div>

        <!-- Result -->
        <div id="result" class="result-box"></div>

        <!-- Badge -->
        <div class="badge-container" id="badgeContainer"></div>

        <!-- Footer -->
        <div class="footer">
            Make sure <strong>GPS</strong> and <strong>Location Services</strong> are ON
        </div>
    </div>

    <script>
        // ============================================
        // COMPLETE JAVASCRIPT - LOCATION TEST
        // ============================================

        const btn = document.getElementById('getLocationBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const badgeContainer = document.getElementById('badgeContainer');

        let isLocating = false;

        // --- Show HTTPS/Local status ---
        function showBadge() {
            const isHttps = window.location.protocol === 'https:';
            const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || 
                            window.location.hostname.startsWith('192.168.') ||
                            window.location.hostname.startsWith('10.') ||
                            window.location.hostname === '0.0.0.0';

            const badge = document.createElement('span');
            badge.className = `badge ${isHttps ? 'https' : isLocal ? 'local' : 'http'}`;
            
            if (isHttps) {
                badge.textContent = '🔒 HTTPS — Location works';
            } else if (isLocal) {
                badge.textContent = '🟢 localhost — Location works';
            } else {
                badge.textContent = '⚠️ HTTP — Location may not work';
                status.className = 'status error';
                status.innerHTML = '⚠️ <strong>HTTPS Required!</strong><br>Location works only on HTTPS or localhost.<br>Please use a secure connection.';
            }
            badgeContainer.appendChild(badge);
        }
        showBadge();

        // --- Get Location ---
        btn.addEventListener('click', function() {
            if (isLocating) return;
            isLocating = true;

            // Check geolocation support
            if (!navigator.geolocation) {
                status.className = 'status error';
                status.innerHTML = '❌ Geolocation is not supported by this browser.';
                isLocating = false;
                return;
            }

            // Check HTTPS
            if (window.location.protocol !== 'https:' && 
                !['localhost', '127.0.0.1', ''].includes(window.location.hostname) &&
                !window.location.hostname.startsWith('192.168.') &&
                !window.location.hostname.startsWith('10.')) {
                status.className = 'status error';
                status.innerHTML = '⚠️ <strong>HTTPS Required!</strong><br>Please use HTTPS for location detection.';
                isLocating = false;
                return;
            }

            // Start loading
            btn.classList.add('loading');
            btn.disabled = true;

            status.className = 'status info';
            status.innerHTML = '📍 Detecting your location...<br><span class="small">Please wait 3-10 seconds</span>';

            result.classList.remove('show');
            result.innerHTML = '';

            // Get position
            navigator.geolocation.getCurrentPosition(
                // Success
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const altitude = position.coords.altitude;
                    const speed = position.coords.speed;
                    const heading = position.coords.heading;

                    btn.classList.remove('loading');
                    btn.disabled = false;
                    isLocating = false;

                    status.className = 'status success';
                    status.innerHTML = '✅ <strong>Location detected successfully!</strong>';

                    result.className = 'result-box show';
                    result.innerHTML = `
                        <div class="big-icon">📍</div>
                        <div class="coords">
                            <strong>Lat:</strong> ${lat.toFixed(6)}<br>
                            <strong>Lon:</strong> ${lon.toFixed(6)}
                        </div>
                        <div class="details-grid">
                            <div class="item">
                                <span class="label">Accuracy</span>
                                <span class="value">${accuracy ? accuracy.toFixed(1) + ' m' : '--'}</span>
                            </div>
                            <div class="item">
                                <span class="label">Altitude</span>
                                <span class="value">${altitude ? altitude.toFixed(1) + ' m' : '--'}</span>
                            </div>
                            <div class="item">
                                <span class="label">Speed</span>
                                <span class="value">${speed ? speed.toFixed(1) + ' m/s' : '--'}</span>
                            </div>
                            <div class="item">
                                <span class="label">Heading</span>
                                <span class="value">${heading ? heading.toFixed(1) + '°' : '--'}</span>
                            </div>
                        </div>
                        <div class="success-msg">
                            ✅ Location is working!<br>
                            <small style="opacity:0.7;">Now your EarthPulse app will work too</small>
                        </div>
                    `;

                    // Save permission
                    try {
                        localStorage.setItem('locationGranted', 'true');
                    } catch (e) {}
                },

                // Error
                function(error) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    isLocating = false;

                    let errorMsg = '';
                    let suggestion = '';

                    switch (error.code) {
                        case 1: // PERMISSION_DENIED
                            errorMsg = '❌ Location Permission Denied';
                            suggestion = 'Please allow location in browser settings and try again.';
                            break;
                        case 2: // POSITION_UNAVAILABLE
                            errorMsg = '❌ Location Unavailable';
                            suggestion = 'Please turn ON GPS/Location Services and try again.';
                            break;
                        case 3: // TIMEOUT
                            errorMsg = '⏱️ Location Request Timed Out';
                            suggestion = 'Please move to an open area for better GPS signal.';
                            break;
                        default:
                            errorMsg = '❌ Unknown Error';
                            suggestion = 'Please try again or check your settings.';
                    }

                    status.className = 'status error';
                    status.innerHTML = `${errorMsg}<br><span class="small">${suggestion}</span>`;

                    // Show alert for permission
                    if (error.code === 1) {
                        setTimeout(function() {
                            const isAndroid = navigator.userAgent.toLowerCase().includes('android');
                            const isIOS = navigator.userAgent.toLowerCase().includes('iphone') || 
                                         navigator.userAgent.toLowerCase().includes('ipad');
                            
                            let msg = '📍 Location Permission Required\n\n';
                            if (isAndroid) {
                                msg += 'Android:\nSettings → Apps → Chrome → Permissions → Location → Allow\n\nThen refresh and try again.';
                            } else if (isIOS) {
                                msg += 'iPhone:\nSettings → Privacy → Location Services → Safari → Allow\n\nThen refresh and try again.';
                            } else {
                                msg += 'Please allow location access in your browser settings.\n\nThen refresh and try again.';
                            }
                            alert(msg);
                        }, 500);
                    }
                },

                // Options
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 60000
                }
            );
        });

        // --- Auto-detect if previously granted ---
        if (localStorage.getItem('locationGranted') === 'true') {
            setTimeout(function() {
                btn.click();
            }, 800);
        }

        // --- Console Log ---
        console.log('📍 Location Test App Loaded');
        console.log('🔒 Protocol:', window.location.protocol);
        console.log('🌐 Hostname:', window.location.hostname);
        console.log('📱 User Agent:', navigator.userAgent);

        // --- Show more info in console ---
        if (window.location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
            console.warn('⚠️ Location may not work without HTTPS!');
        }

        console.log('✅ Ready to detect location');
    </script>
</body>
</html>
