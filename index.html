<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>📍 Location Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c2740, #061522);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 25px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: rgba(255,255,255,0.6);
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 30px rgba(0,212,255,0.25);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.6;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }
        .status.success {
            border-color: rgba(76,223,139,0.3);
            background: rgba(76,223,139,0.08);
            color: #4cdf8b;
        }
        .status.error {
            border-color: rgba(255,107,107,0.3);
            background: rgba(255,107,107,0.08);
            color: #ff6b6b;
        }
        .status.info {
            border-color: rgba(0,212,255,0.3);
            background: rgba(0,212,255,0.08);
            color: #72dfff;
        }
        .result-box {
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            display: none;
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
        }
        .result-box.show {
            display: block;
        }
        .result-box strong {
            color: #00d4ff;
        }
        .coordinates {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
        }
        .hint {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 15px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
        }
        .badge.https {
            background: rgba(76,223,139,0.15);
            color: #4cdf8b;
        }
        .badge.http {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .btn.loading .spinner {
            display: inline-block;
        }
        .btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .details-grid .item {
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 12px;
        }
        .details-grid .item strong {
            display: block;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📍</div>
        <h1>Location Test</h1>
        <p>Check if your phone can detect location</p>

        <button id="getLocationBtn" class="btn">
            <span class="btn-text">📍 Get My Location</span>
            <span class="spinner"></span>
        </button>

        <div id="status" class="status">Ready to detect location</div>
        <div id="result" class="result-box"></div>

        <div id="badgeContainer"></div>
        <div class="hint">Make sure GPS and Location Services are ON</div>
    </div>

    <script>
        const btn = document.getElementById('getLocationBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const badgeContainer = document.getElementById('badgeContainer');

        // --- Show HTTPS status ---
        function showBadge() {
            const isHttps = window.location.protocol === 'https:';
            const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
            const badge = document.createElement('div');
            badge.className = `badge ${isHttps || isLocal ? 'https' : 'http'}`;
            badge.textContent = isHttps || isLocal ? '🔒 HTTPS - Location works' : '⚠️ HTTP - Location may not work';
            badgeContainer.appendChild(badge);
            
            if (!isHttps && !isLocal) {
                status.className = 'status error';
                status.innerHTML = '⚠️ <strong>HTTPS Required!</strong><br>Location works only on HTTPS or localhost.<br>Please use a secure connection.';
            }
        }
        showBadge();

        // --- Get Location ---
        btn.addEventListener('click', function() {
            // Check if geolocation is available
            if (!navigator.geolocation) {
                status.className = 'status error';
                status.innerHTML = '❌ Geolocation is not supported by this browser.';
                return;
            }

            // Check HTTPS
            if (window.location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
                status.className = 'status error';
                status.innerHTML = '⚠️ <strong>HTTPS Required!</strong><br>Please use HTTPS or localhost for location.';
                return;
            }

            // Start loading
            btn.classList.add('loading');
            btn.disabled = true;
            status.className = 'status info';
            status.innerHTML = '📍 Detecting your location...<br><small>Please wait 3-10 seconds</small>';
            result.classList.remove('show');
            result.innerHTML = '';

            // Try to get location
            navigator.geolocation.getCurrentPosition(
                // Success
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const alt = position.coords.altitude;
                    const speed = position.coords.speed;

                    btn.classList.remove('loading');
                    btn.disabled = false;

                    status.className = 'status success';
                    status.innerHTML = '✅ Location detected successfully!';

                    result.className = 'result-box show';
                    result.innerHTML = `
                        <div style="text-align:center;margin-bottom:10px;">
                            <span style="font-size:40px;">📍</span>
                        </div>
                        <div class="coordinates">
                            <strong>Latitude:</strong> ${lat.toFixed(6)}<br>
                            <strong>Longitude:</strong> ${lon.toFixed(6)}
                        </div>
                        <div class="details-grid">
                            <div class="item">
                                <strong>Accuracy</strong>
                                ${accuracy ? accuracy.toFixed(1) + ' m' : '--'}
                            </div>
                            <div class="item">
                                <strong>Altitude</strong>
                                ${alt ? alt.toFixed(1) + ' m' : '--'}
                            </div>
                            <div class="item">
                                <strong>Speed</strong>
                                ${speed ? speed.toFixed(1) + ' m/s' : '--'}
                            </div>
                            <div class="item">
                                <strong>Time</strong>
                                ${new Date().toLocaleTimeString()}
                            </div>
                        </div>
                        <div style="margin-top:12px;text-align:center;font-size:13px;color:rgba(255,255,255,0.5);">
                            ✅ Location is working!<br>
                            <small>Now your EarthPulse app will work too</small>
                        </div>
                    `;

                    // Save permission
                    try {
                        localStorage.setItem('locationGranted', 'true');
                    } catch(e) {}
                },

                // Error
                function(error) {
                    btn.classList.remove('loading');
                    btn.disabled = false;

                    let errorMsg = '';
                    let suggestion = '';

                    switch(error.code) {
                        case 1: // PERMISSION_DENIED
                            errorMsg = '❌ Permission Denied';
                            suggestion = 'Please allow location in browser settings:\n\nChrome: Settings → Site Settings → Location → Allow\nSafari: Settings → Privacy → Location Services → On';
                            break;
                        case 2: // POSITION_UNAVAILABLE
                            errorMsg = '❌ Location Unavailable';
                            suggestion = 'Please turn ON GPS/Location Services and try again.';
                            break;
                        case 3: // TIMEOUT
                            errorMsg = '⏱️ Location Timed Out';
                            suggestion = 'Please move to an open area for better GPS signal.';
                            break;
                        default:
                            errorMsg = '❌ Unknown Error';
                            suggestion = 'Please try again or check your location settings.';
                    }

                    status.className = 'status error';
                    status.innerHTML = `${errorMsg}<br><small>${suggestion}</small>`;
                    
                    // Show alert for permission
                    if (error.code === 1) {
                        setTimeout(() => {
                            alert('📍 Location Permission Required\n\nPlease allow location access:\n\nAndroid: Settings → Apps → Chrome → Permissions → Location → Allow\n\niPhone: Settings → Privacy → Location Services → Safari → Allow\n\nThen refresh and try again.');
                        }, 500);
                    }
                },

                // Options
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 60000
                }
            );
        });

        // Auto-detect if previously granted
        if (localStorage.getItem('locationGranted') === 'true') {
            setTimeout(() => {
                btn.click();
            }, 1000);
        }

        console.log('📍 Location Test App Loaded');
        console.log('🔒 Protocol:', window.location.protocol);
        console.log('🌐 Hostname:', window.location.hostname);
    </script>
</body>
</html>
